name: Scope check

on:
  pull_request:

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fail if PR touches files outside the author's scope
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          # Read scope rules from the base branch so a PR cannot edit its own permissions.
          git show "$BASE_SHA:.github/scope-map.json" > /tmp/scope-map.json
          cp /tmp/scope-map.json .github/scope-map.json
          node scripts/check-scope.js
