# Render Blueprint. Auto-deploys from `main` only (dev is integration, never deployed). Secrets (sync: false) are set in the Render dashboard.
services:
  - type: web
    name: civicpulse-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm ci && npm run build:contract && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        value: report-media
      - key: CORS_ORIGIN
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: civicpulse-web
    runtime: static
    rootDir: .
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build:contract && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_USE_MOCKS
        value: "false"
